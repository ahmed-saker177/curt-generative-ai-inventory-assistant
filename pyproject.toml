[project]
name = "curt"
version = "0.1.0"
description = "CURT inventory assistant with rule-based and LLM-powered phases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "groq>=0.31.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.0.1",
    "streamlit>=1.64.0",
    "uvicorn[standard]>=0.30.0",
    "watchdog>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]